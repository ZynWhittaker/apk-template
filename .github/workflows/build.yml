name: Build APK
on:
  workflow_dispatch:
    inputs:
      source_type:
        required: true
      web_url:
        required: false
      file_name:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      
      - name: Siapkan Web Assets
        run: |
          mkdir -p app/src/main/assets/www
          if [ "${{ github.event.inputs.source_type }}" == "zip" ]; then
            unzip input/${{ github.event.inputs.file_name }} -d app/src/main/assets/www/
          else
            wget -q -r -np -nH -k -p -e robots=off "${{ github.event.inputs.web_url }}" -P app/src/main/assets/www/
          fi
          
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
